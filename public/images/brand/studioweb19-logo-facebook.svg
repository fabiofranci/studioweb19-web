<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" role="img" aria-labelledby="title desc">
  <title id="title">StudioWeb19</title>
  <desc id="desc">Logo SW19 Studio Web 19</desc>
  <defs>
    <linearGradient id="sw-blue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="960" height="960" fill="#070b14"/>
  <g filter="url(#soft-shadow)">
    <text x="94" y="548" fill="#f8fafc" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="228" font-weight="900" letter-spacing="-10">S</text>
    <text x="350" y="548" fill="url(#sw-blue)" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="228" font-weight="900" letter-spacing="-14">W</text>
    <text x="618" y="548" fill="#f8fafc" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="228" font-weight="900" letter-spacing="-8">19</text>
  </g>
  <line x1="162" y1="612" x2="210" y2="612" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <text x="242" y="626" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" letter-spacing="24">STUDIO WEB 19</text>
  <line x1="710" y1="612" x2="758" y2="612" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
</svg>
